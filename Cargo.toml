[package]
name = "gh-arriba"
version = "1.0.0"
edition = "2024"
description = "GitHub CLI extension for review threads, CI retries, releases, Dependabot, and config sync"
license = "MIT"
repository = "https://github.com/nmoinvaz/gh-arriba"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secretscan = "0.2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
